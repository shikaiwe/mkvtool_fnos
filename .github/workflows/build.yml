name: Build FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 创建 Release 需要 contents: write 权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          npm --prefix web ci || npm --prefix web install --no-audit --no-fund
          npm --prefix web run build
          rm -rf app/www && cp -r web/dist app/www

      - name: Prepare backend
        run: |
          [ -f server/package-lock.json ] || npm --prefix server install --no-audit --no-fund
          mkdir -p app/server
          cp server/package.json server/package-lock.json app/server/
          cp -r server/lib server/api app/server/
          cp server/index.mjs app/server/
          npm --prefix app/server ci --omit=dev --no-audit --no-fund

      - name: Prepare mkvtoolnix binaries
        run: bash scripts/prepare-binaries.sh

      - name: Install fnpack
        run: |
          mkdir -p tools
          curl -fsSL --retry 3 -o tools/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x tools/fnpack

      - name: Pack fpk
        run: |
          ./tools/fnpack build
          VERSION="$(grep -E '^version=' manifest | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          # 仅 mv 改名不影响包内容；勿做任何解包/重打包
          mv mkvtoolnix.fpk "mkvtoolnix-$VERSION.fpk"

      # 原生 fnpack 产物(CRLF manifest/0666 权限)真机可装;任何 tar 重打包
      # 都会导致「应用包格式不符合系统版本要求」,勿对 fpk 做后处理。
      - name: Upload artifact (Actions 页可下载)
        uses: actions/upload-artifact@v4
        with:
          name: mkvtoolnix-fpk
          path: mkvtoolnix-*.fpk

      - name: Release (仅打 v* 标签时，发布到 Releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mkvtoolnix-*.fpk
            THIRD-PARTY-LICENSES.md
          body: |
            MKVToolNix for fnOS（${{ github.ref_name }}）

            安装：fnOS 应用中心「手动安装」导入随附的 mkvtoolnix-版本号.fpk
            （需安装 nodejs_v22 运行时），安装后在 应用设置 → 文件访问授权 中勾选媒体目录。

            合规说明：包内包含未修改的 MKVToolNix 官方二进制（GPL-2.0，
            捆绑的 libebml/libmatroska 为 LGPL）。许可文本见包内 licenses/ 目录与
            THIRD-PARTY-LICENSES.md，源码获取：https://mkvtoolnix.download/source.html
          generate_release_notes: true
